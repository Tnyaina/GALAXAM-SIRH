server {
    listen 80;
    server_name _;

    # Seul le relais Rust appelle ce service. Les navigateurs doivent passer
    # par l'origine desktop commune à React et à l'API.
    if ($host != "127.0.0.1") { return 403; }
    if ($http_origin != "") { return 403; }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 55m;
    }
}
