spring.application.name=sirh

# ==============================================================
# CONFIGURATION DU SERVEUR WEB
# ==============================================================
server.port=8080
# Contexte de l'API (toutes tes routes commenceront par /api)
server.servlet.context-path=/api
app.cors.allowed-origins=http://localhost:*

# ==============================================================
# CONFIGURATION DE LA BASE DE DONNÉES (PostgreSQL)
# ==============================================================
# Les identifiants doivent correspondre exactement au docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/sirh_galaxam
spring.datasource.username=galaxam_admin
spring.datasource.password=galaxam_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# OPTIMISATION DU POOL DE CONNEXIONS (HikariCP)
# ==============================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==============================================================
# PARAMÉTRAGE DES FUSEAUX HORAIRES (Crucial pour le pointage)
# ==============================================================
# Force l'application et la sérialisation JSON sur l'heure de Madagascar
spring.jackson.time-zone=Indian/Antananarivo

# ==============================================================
# LOGS ET DÉBOGAGE (Spécifique à Spring Data JDBC)
# ==============================================================
# Affiche les requêtes SQL générées et exécutées par le JdbcClient dans la console
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG

# Affiche un formatage propre pour tes logs locaux
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================================
# CONFIGURATION DE LA SECURITE (JWT & Refresh Token)
# ==============================================================
# Clé secrète de 512 bits encodée en Base64 (à changer en production)
app.security.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3VmZmljaWVudGx5LWxvbmctc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctYnktYW50aWdyYXZpdHk=}
# Durée de validité de l'Access Token (150 minutes)
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:9000000}
# Durée de validité du Refresh Token (7 jours)
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

