spring.application.name=sirh
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================
# CONFIGURATION DU SERVEUR
# ==============================================================
server.port=8080
server.servlet.context-path=/api


# ==============================================================
# TIMEZONE
# ==============================================================
spring.jackson.time-zone=Indian/Antananarivo


# ==============================================================
# JWT
# ==============================================================

app.security.jwt.secret=${JWT_SECRET}

app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}

app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.session.idle-timeout-seconds=${SESSION_IDLE_TIMEOUT_SECONDS:900}

# ==============================================================
# CORS
# ==============================================================
app.cors.allowed-origins=${CORS_ORIGIN}

# ==============================================================
# COMPRESSION HTTP (GZIP RESPONSES API)
# ==============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024


# ==============================================================
# LOGS
# ==============================================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================================
# STOCKAGE LOCAL DES FICHIERS & PHOTOS (AUCUNE DÉPENDANCE EXTERNE)
# ==============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.upload.dir=${UPLOAD_DIR:uploads/photo}

# ==============================================================
# BOOTSTRAP ADMINISTRATEUR PAR DEFAUT (AUTO-SEEDING)
# ==============================================================
# Activer explicitement au premier démarrage avec un nom, une adresse e-mail et un secret
# fournis par l'environnement. Aucun compte connu ne doit être créé par défaut.
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.default-admin.name=${GALAXAM_DEFAULT_ADMIN_NAME:${SIRH_ADMIN_NAME:Tatamo Michele}}
app.security.default-admin.email=${GALAXAM_DEFAULT_ADMIN_EMAIL:${SIRH_ADMIN_EMAIL:}}
app.security.default-admin.password=${GALAXAM_DEFAULT_ADMIN_PASSWORD:${SIRH_ADMIN_PASSWORD:}}
