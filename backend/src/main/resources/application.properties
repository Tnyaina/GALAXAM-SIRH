spring.application.name=sirh
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================
# CONFIGURATION DU SERVEUR
# ==============================================================
server.port=8080
server.servlet.context-path=/api


# ==============================================================
# TIMEZONE
# ==============================================================
spring.jackson.time-zone=Indian/Antananarivo
spring.jpa.properties.hibernate.jdbc.time_zone=Indian/Antananarivo


# ==============================================================
# JWT
# ==============================================================

app.security.jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RrZXlmb3JnYWxheGFtc2lyaGFwcGxpY2F0aW9ucHJvZHVjdGlvbnNlY3VyZTUxMmJpdHM=}

app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:9000000}

app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==============================================================
# CORS
# ==============================================================
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:4173}

# ==============================================================
# COMPRESSION HTTP (GZIP RESPONSES API)
# ==============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024


# ==============================================================
# LOGS
# ==============================================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================================
# UPLOAD DE FICHIERS & IMGBB CLOUD
# ==============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/photos}
app.imgbb.api-key=${IMGBB_API_KEY:16da31a095830083321b07cab6e52c92}
app.imgbb.upload-url=https://api.imgbb.com/1/upload