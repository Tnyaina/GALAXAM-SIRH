# ==============================================================
# CONFIGURATION DÉDIÉE E2E REAL BROWSER TESTING
# ==============================================================

server.port=8085
spring.datasource.url=jdbc:postgresql://localhost:5432/sirh_galaxam_test
spring.datasource.username=galaxam_admin
spring.datasource.password=galaxam_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jackson.time-zone=Indian/Antananarivo

# JWT configuration for E2E tests (P1-04: secret >= 64 bytes pour HS512)
app.security.jwt.secret=galaxam-test-only-jwt-secret-key-never-use-outside-tests-2026-minimum64b
app.security.jwt.access-token-expiration-ms=3600000
app.security.jwt.refresh-token-expiration-ms=86400000

# Les fixtures créent explicitement leurs comptes ; aucun bootstrap implicite.
app.security.bootstrap-admin.enabled=false
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:5174,http://localhost:4174

# Aucun traitement de rattrapage ne doit modifier la base pendant le démarrage
app.rattrapage.enabled=false
