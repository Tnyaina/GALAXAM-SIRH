# Configuration contractuelle V1 : aucune valeur employeur n'est présumée.
# Copier ces clés dans une configuration Spring externe, puis redémarrer le backend.
# Chargement possible : --spring.config.additional-location=file:/chemin/configuration.properties
# Remplacer les identifiants ci-dessous par les id_filiale / id_contrat réels.
# Les valeurs doivent provenir de la DAF/RH. Ce fichier est un exemple commenté,
# non une configuration chargée automatiquement.

# L'adresse du siège et le RCS proviennent de ref_filiale, pas de cette configuration.
# Le nom et la fonction sont recherchés sur la DAF active unique de la filiale.
# Si aucun signataire n'est trouvé, le canevas reste à compléter avant signature.
# app.documents.contrats.filiales.<idFiliale>.SIGNATAIRE_NOM=
# app.documents.contrats.filiales.<idFiliale>.SIGNATAIRE_FONCTION=
# app.documents.contrats.filiales.<idFiliale>.SIGNATAIRE_VILLE=

# CDI / CDD / Stage / Temporaire : durée hebdomadaire de référence lue
# dans paie_config_legale à la date de début du contrat. Pas de clé par contrat.

# Stage : aucune assimilation automatique du salaire de base à une gratification :
# app.documents.contrats.contrats.<idContrat>.STAGE_ETABLISSEMENT=
# app.documents.contrats.contrats.<idContrat>.STAGE_GRATIFICATION=
# Facultatif :
# app.documents.contrats.contrats.<idContrat>.STAGE_REFERENT_ETABLISSEMENT=

# Prestation : aucun montant/honoraire ou échéancier déduit du salaire/mode de paie :
# app.documents.contrats.contrats.<idContrat>.PRESTATION_MONTANT=
# app.documents.contrats.contrats.<idContrat>.PRESTATION_MODALITES_PAIEMENT=

# La date de signature provient du contrat. Si absente, le canevas affiche
# explicitement « À renseigner lors de la signature » ; aucune date n'est inventée.
# Les clauses entre crochets et l'emplacement du logo restent à valider/compléter.

# Temporaire : TEMPORAIRE_MOTIF provient de contrat_travail.description.
# Son absence est signalée explicitement (caractère obligatoire à confirmer DAF/RH).
# TEMPORAIRE_UNITE_REMUNERATION provient du code de ref_mode_calcul_paie :
# HORAIRE / JOURNALIER / MENSUEL. Aucune clé externe ni conversion du montant.
