# ==============================================================
# DATABASE LOCAL
# ==============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/sirh_galaxam
spring.datasource.username=galaxam_admin
spring.datasource.password=galaxam_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Valeur strictement locale (P1-04: secret >= 64 bytes pour HS512). La production doit fournir JWT_SECRET.
app.security.jwt.secret=galaxam-development-only-jwt-key-never-use-in-production-2026-minimum64b

# HIKARICP RESILIENCE 
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10


# ==============================================================
# CORS LOCAL
# ==============================================================

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Le compte administrateur initial est créé une seule fois si la base ne contient
# aucun administrateur actif. BOOTSTRAP_ADMIN_ENABLED=false permet de le désactiver.
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
