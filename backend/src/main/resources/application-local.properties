# ==============================================================
# DATABASE LOCAL
# ==============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sirh_galaxam}
spring.datasource.username=${DATABASE_USERNAME:galaxam_admin}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Secret propre a chaque installation, fourni par Compose.
app.security.jwt.secret=${JWT_SECRET}

# HIKARICP RESILIENCE 
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10


# ==============================================================
# CORS LOCAL
# ==============================================================

app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:4173}

# Le compte administrateur initial est créé une seule fois si la base ne contient
# aucun administrateur actif. BOOTSTRAP_ADMIN_ENABLED=false permet de le désactiver.
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.default-admin.name=${GALAXAM_DEFAULT_ADMIN_NAME:${SIRH_ADMIN_NAME:Tatamo Michele}}
app.security.default-admin.email=${GALAXAM_DEFAULT_ADMIN_EMAIL:${SIRH_ADMIN_EMAIL:}}
app.security.default-admin.password=${GALAXAM_DEFAULT_ADMIN_PASSWORD:${SIRH_ADMIN_PASSWORD:}}
