# ==============================================================
# DATABASE LOCAL
# ==============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/sirh_galaxam
spring.datasource.username=galaxam_admin
spring.datasource.password=galaxam_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Valeur strictement locale. La production doit fournir JWT_SECRET.
app.security.jwt.secret=galaxam-development-only-jwt-key-never-use-in-production-2026

# HIKARICP RESILIENCE 
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10


# ==============================================================
# CORS LOCAL
# ==============================================================

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Bootstrap volontairement désactivé. Pour une initialisation locale ponctuelle,
# fournir BOOTSTRAP_ADMIN_ENABLED=true et les deux variables GALAXAM_DEFAULT_ADMIN_*.
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}


# ==============================================================
# DEBUG SQL LOCAL
# ==============================================================

logging.level.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG
