# ==============================================================
# BASE DE DONNÉES (ENVIRONNEMENT CONTENEURISÉ)
# ==============================================================

# docker-compose.yml fournit SPRING_DATASOURCE_URL au format jdbc:postgresql://...
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================================================
# CORS PRODUCTION
# ==============================================================

app.cors.allowed-origins=${CORS_ORIGIN}


# ==============================================================
# HIKARICP
# ==============================================================

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
