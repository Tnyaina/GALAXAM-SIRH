# ==============================================================
# BASE DE DONNÉES PROD (DOCKER OU NATIVE)
# ==============================================================

# Docker fournit une URL interne ; hors Docker la base PROD locale est séparée.
spring.datasource.url=${SPRING_DATASOURCE_URL:${SIRH_PROD_DB_URL:jdbc:postgresql://127.0.0.1:5432/sirh_galaxam}}
spring.datasource.username=${DATABASE_USERNAME:galaxam_prod_admin}
spring.datasource.password=${SIRH_PROD_DB_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
app.security.jwt.secret=${SIRH_PROD_JWT_SECRET:${JWT_SECRET}}
app.security.bootstrap-admin.enabled=${SIRH_PROD_BOOTSTRAP_ADMIN_ENABLED:${BOOTSTRAP_ADMIN_ENABLED:false}}


# ==============================================================
# CORS PRODUCTION
# ==============================================================

app.cors.allowed-origins=${SIRH_PROD_CORS_ORIGIN:${CORS_ORIGIN}}


# ==============================================================
# HIKARICP
# ==============================================================

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
