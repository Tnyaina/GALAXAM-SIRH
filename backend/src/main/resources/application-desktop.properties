# Native desktop backend. A launcher may override the root for Windows or a managed installation.
app.desktop.home=${GALAXAM_DESKTOP_HOME:${user.home}/Library/Application Support/GALAXAM SIRH}
app.desktop.config-dir=${app.desktop.home}/config
app.desktop.data-dir=${app.desktop.home}/data
app.desktop.documents-dir=${app.desktop.home}/documents

# Keep the native API on loopback and on the port expected by the current Tauri proxy.
# Stop the Docker desktop-api relay before using the default port.
server.address=127.0.0.1
server.port=${GALAXAM_BACKEND_PORT:18080}

# These values must be supplied externally. No desktop profile connects to a database by default.
spring.datasource.url=${GALAXAM_DESKTOP_DB_URL}
spring.datasource.username=${GALAXAM_DESKTOP_DB_USER}
spring.datasource.password=${GALAXAM_DESKTOP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
# The desktop backend serves one local client. Keep its idle pool and web
# worker count small so it remains comfortable on PCs with limited RAM.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=20

# Preserve the existing JWT and Spring Security behavior with an external secret.
app.security.jwt.secret=${GALAXAM_DESKTOP_JWT_SECRET}
app.cors.allowed-origins=${GALAXAM_DESKTOP_CORS_ORIGIN:http://127.0.0.1:18888}
app.security.bootstrap-admin.enabled=false
app.desktop.bootstrap-state=${GALAXAM_DESKTOP_BOOTSTRAP_STATE:${app.desktop.config-dir}/bootstrap.state}
app.rattrapage.enabled=true

# Persistent files remain outside the JAR and the .app bundle.
app.upload.dir=${app.desktop.documents-dir}/photo
app.upload.doc-dir=${app.desktop.documents-dir}/documents
app.upload.prestataire-dir=${app.desktop.documents-dir}/prestataires
logging.file.name=${GALAXAM_DESKTOP_LOG_FILE:${app.desktop.home}/logs/backend.log}
