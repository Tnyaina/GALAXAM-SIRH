# Le point d'entree par defaut est la pile web de production.
# Les secrets locaux sont conserves dans .env.production (ignore par Git).
# Le script compose de ce depot applique --env-file .env.production.
include:
  - path: docker-compose.web.yml
    env_file: .env.production
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${GALAXAM_DB_PASSWORD:?Mot de passe PostgreSQL requis}
  migrate:
    environment:
      PGPASSWORD: ${GALAXAM_DB_PASSWORD:?Mot de passe PostgreSQL requis}
  backend:
    environment:
      DATABASE_PASSWORD: ${GALAXAM_DB_PASSWORD:?Mot de passe PostgreSQL requis}
      JWT_SECRET: ${GALAXAM_JWT_SECRET:?Cle JWT requise}
      CORS_ORIGIN: ${GALAXAM_CORS_ORIGIN:-http://localhost:8088,http://127.0.0.1:8088}
      BOOTSTRAP_ADMIN_ENABLED: ${GALAXAM_PROD_BOOTSTRAP_ADMIN_ENABLED:-false}
      GALAXAM_DEFAULT_ADMIN_NAME: ${GALAXAM_DEFAULT_ADMIN_NAME:-Administrateur GALAXAM}
      GALAXAM_DEFAULT_ADMIN_EMAIL: ${GALAXAM_DEFAULT_ADMIN_EMAIL:-}
      GALAXAM_DEFAULT_ADMIN_PASSWORD: ${GALAXAM_DEFAULT_ADMIN_PASSWORD:-}
